<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141727" />
      <stop offset="50%" stop-color="#0b0d17" />
      <stop offset="100%" stop-color="#06070c" />
    </linearGradient>
    <linearGradient id="vortexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#7c3aed" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer ambient glow ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#vortexGrad)" stroke-width="4" stroke-opacity="0.2" stroke-dasharray="12 16" />

  <!-- Obsidian Rhombus / Diamond base -->
  <g transform="translate(256, 256)">
    <!-- Central Vortex Spirals -->
    <path d="M 0 -150 C 90 -130, 160 -60, 160 30 C 160 120, 90 170, 0 170 C -80 170, -140 120, -140 40 C -140 -30, -90 -80, -20 -80 C 40 -80, 80 -40, 80 10 C 80 50, 50 80, 10 80 C -20 80, -40 60, -40 30 C -40 10, -20 -5, 0 0" 
          fill="none" 
          stroke="url(#vortexGrad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          filter="url(#glow)" />

    <!-- Obsidian Shards -->
    <polygon points="0,-180 36,-90 0,-110 -36,-90" fill="#a855f7" opacity="0.9" />
    <polygon points="180,0 90,36 110,0 90,-36" fill="#06b6d4" opacity="0.9" />
    <polygon points="0,180 -36,90 0,110 36,90" fill="#6366f1" opacity="0.9" />
    <polygon points="-180,0 -90,-36 -110,0 -90,36" fill="#8b5cf6" opacity="0.9" />

    <!-- Core glowing node -->
    <circle cx="0" cy="0" r="16" fill="#22d3ee" filter="url(#glow)" />
    <circle cx="0" cy="0" r="8" fill="#ffffff" />
  </g>
</svg>
